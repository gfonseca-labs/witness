[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "blackwood-witness"
version = "0.1.0"
description = "A small cryptographic file-integrity utility."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Blackwood"}]
requires-python = ">=3.11"
dependencies = [
    "cryptography>=43",
]

[project.scripts]
blackwood-witness = "witness.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[project.urls]
Repository = "https://github.com/gfonseca-labs/witness"
Issues = "https://github.com/gfonseca-labs/witness/issues"
